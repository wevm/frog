# GitHub App manifest. Create the App from this at
# https://github.com/settings/apps/new (or an organization's equivalent).
name: frog
description: >-
  Turns friction recorded in .agents/friction-log into GitHub issues, and keeps the two in sync.
url: https://github.com/wevm/frog
public: true

default_events:
  # Reports what a pull request introduces, and comments with the result.
  - pull_request
  # Wakes the repository-owned workflow when a linked issue closes or reopens.
  - issues

default_permissions:
  # Reads config and friction reports. Repository-owned Actions make every commit.
  contents: read
  # Files issues, and comments on the one already covering a friction.
  issues: write
  # Reads repository metadata, including the default branch.
  metadata: read
  # Receives pull request events and reads comments before updating them.
  pull_requests: read
