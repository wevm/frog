name: Frog
description: File and reconcile friction with the repository's own GitHub token.

inputs:
  token:
    description: GitHub token used for issues, pushes, and pull requests.
    default: ${{ github.token }}
  command:
    description: Path to a Frog executable. When absent, Frog is installed in the runner's temporary directory.
    default: ''
  cwd:
    description: Repository directory to run in.
    default: .
  push:
    description: Where to push committed changes. One of direct, pull-request, or none.
    default: pull-request
  branch:
    description: Branch force-updated when push is pull-request.
    default: frog/sync
  commit:
    description: Whether Frog commits changes.
    default: 'true'
  dry-run:
    description: Report changes without filing, writing, committing, or pushing.
    default: 'false'
  max:
    description: Maximum entries to publish in this run. The repository config applies when absent.
    default: ''
  issue-author:
    description: GitHub login trusted as the author of issues created by this token.
    default: github-actions[bot]
  version:
    description: Frog npm version to install when command is absent.
    default: '1'
  git-name:
    description: Git committer name.
    default: github-actions[bot]
  git-email:
    description: Git committer email.
    default: 41898282+github-actions[bot]@users.noreply.github.com
  remote:
    description: Git remote to push.
    default: origin

outputs:
  publish:
    description: Raw full-output JSON envelope from frog publish.
    value: ${{ steps.frog.outputs.publish }}
  sync:
    description: Raw full-output JSON envelope from frog sync.
    value: ${{ steps.frog.outputs.sync }}
  created:
    description: Number of entries linked in the created category.
    value: ${{ steps.frog.outputs.created }}
  commented:
    description: Number of entries linked in the commented category.
    value: ${{ steps.frog.outputs.commented }}
  publish-deferred:
    description: Number of entries deferred by publish.
    value: ${{ steps.frog.outputs['publish-deferred'] }}
  cleared:
    description: Number of missing issue links cleared.
    value: ${{ steps.frog.outputs.cleared }}
  removed:
    description: Number of resolved entries removed.
    value: ${{ steps.frog.outputs.removed }}
  reopened:
    description: Number of entries rebuilt after their issues reopened.
    value: ${{ steps.frog.outputs.reopened }}
  updated:
    description: Number of entries updated or rebuilt.
    value: ${{ steps.frog.outputs.updated }}
  sync-deferred:
    description: Number of entries deferred by sync.
    value: ${{ steps.frog.outputs['sync-deferred'] }}

runs:
  using: composite
  steps:
    - id: frog
      name: File and reconcile friction
      shell: bash
      env:
        FROG_INPUT_TOKEN: ${{ inputs.token }}
        FROG_INPUT_COMMAND: ${{ inputs.command }}
        FROG_INPUT_CWD: ${{ inputs.cwd }}
        FROG_INPUT_PUSH: ${{ inputs.push }}
        FROG_INPUT_BRANCH: ${{ inputs.branch }}
        FROG_INPUT_COMMIT: ${{ inputs.commit }}
        FROG_INPUT_DRY_RUN: ${{ inputs['dry-run'] }}
        FROG_INPUT_MAX: ${{ inputs.max }}
        FROG_INPUT_ISSUE_AUTHOR: ${{ inputs['issue-author'] }}
        FROG_INPUT_VERSION: ${{ inputs.version }}
        FROG_INPUT_GIT_NAME: ${{ inputs['git-name'] }}
        FROG_INPUT_GIT_EMAIL: ${{ inputs['git-email'] }}
        FROG_INPUT_REMOTE: ${{ inputs.remote }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail

        fail() {
          echo "::error::$1"
          exit 1
        }

        write_multiline_output() {
          local name="$1"
          local value="$2"
          local delimiter="FROG_${name//-/_}_${RANDOM}_${RANDOM}"
          {
            echo "${name}<<${delimiter}"
            printf '%s\n' "$value"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        json_count() {
          local envelope="$1"
          local key="$2"
          jq -r --arg key "$key" \
            '(.data[$key] // []) | if type == "array" then length else 0 end' \
            <<< "$envelope" 2>/dev/null || printf '0'
        }

        json_committed() {
          jq -r 'if .ok == true and .data.committed == true then "true" else "false" end' \
            <<< "$1" 2>/dev/null || printf 'false'
        }

        case "$FROG_INPUT_PUSH" in
          direct|pull-request|none) ;;
          *) fail 'push must be direct, pull-request, or none.' ;;
        esac
        case "$FROG_INPUT_COMMIT" in
          true|false) ;;
          *) fail 'commit must be true or false.' ;;
        esac
        case "$FROG_INPUT_DRY_RUN" in
          true|false) ;;
          *) fail 'dry-run must be true or false.' ;;
        esac
        if [[ "$FROG_INPUT_COMMIT" == 'false' && "$FROG_INPUT_PUSH" != 'none' ]]; then
          fail 'commit=false requires push=none.'
        fi

        workspace="${GITHUB_WORKSPACE:-$PWD}"
        cwd="$FROG_INPUT_CWD"
        if [[ "$cwd" != /* ]]; then cwd="$workspace/$cwd"; fi
        if ! cwd="$(cd "$cwd" && pwd)"; then fail "Cannot enter $FROG_INPUT_CWD."; fi
        if ! git -C "$cwd" rev-parse --show-toplevel >/dev/null 2>&1; then
          fail "$FROG_INPUT_CWD is not inside a git repository."
        fi

        token="$FROG_INPUT_TOKEN"
        issue_author="$FROG_INPUT_ISSUE_AUTHOR"
        if [[ ! "$issue_author" =~ ^[A-Za-z0-9_.-]+(\[bot\])?$ ]]; then
          fail 'issue-author must be a GitHub login.'
        fi
        if [[ "${GITHUB_EVENT_NAME:-}" == 'issues' ]]; then
          if [[ -z "${GITHUB_EVENT_PATH:-}" || ! -f "$GITHUB_EVENT_PATH" ]]; then
            fail 'GITHUB_EVENT_PATH is required for issue events.'
          fi
          event_author="$(jq -r '.issue.user.login // empty' "$GITHUB_EVENT_PATH")"
          if [[ "$event_author" != "$issue_author" ]]; then
            echo '::warning::Ignoring an issue event from an untrusted report author.'
            exit 0
          fi
        fi

        if ! git -C "$cwd" config --local user.name "$FROG_INPUT_GIT_NAME"; then
          fail 'Could not configure git user.name.'
        fi
        if ! git -C "$cwd" config --local user.email "$FROG_INPUT_GIT_EMAIL"; then
          fail 'Could not configure git user.email.'
        fi

        auth_header=''
        if [[ -n "$token" ]]; then
          echo "::add-mask::$token"
          credential="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\r\n')"
          echo "::add-mask::$credential"
          auth_header="AUTHORIZATION: basic $credential"
        fi

        git_remote() {
          if [[ -n "$auth_header" ]]; then
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.extraheader \
              GIT_CONFIG_VALUE_0="$auth_header" \
              git -C "$cwd" "$@"
          else
            git -C "$cwd" "$@"
          fi
        }

        frog_command="$FROG_INPUT_COMMAND"
        if [[ -n "$frog_command" ]]; then
          if [[ "$frog_command" == */* && "$frog_command" != /* ]]; then
            frog_command="$workspace/$frog_command"
          elif [[ "$frog_command" != */* ]]; then
            frog_command="$(command -v "$frog_command" || true)"
          fi
          if [[ ! -x "$frog_command" ]]; then fail 'command must name an executable Frog binary.'; fi
        else
          runner_temp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          if ! install_root="$(mktemp -d "${runner_temp%/}/frog-action.XXXXXX")"; then
            fail 'Could not create the isolated Frog installation directory.'
          fi
          if ! npm install \
            --prefix "$install_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --no-package-lock \
            --no-save \
            "frog@$FROG_INPUT_VERSION"; then
            fail "Could not install frog@$FROG_INPUT_VERSION."
          fi
          frog_command="$install_root/node_modules/.bin/frog"
          if [[ ! -x "$frog_command" ]]; then fail 'The installed Frog executable is missing.'; fi
        fi

        default_branch=''
        if [[ -n "${GITHUB_EVENT_PATH:-}" && -f "$GITHUB_EVENT_PATH" ]]; then
          default_branch="$(jq -r '.repository.default_branch // empty' "$GITHUB_EVENT_PATH")"
        fi
        if [[ -z "$default_branch" ]]; then
          default_branch="$(git -C "$cwd" branch --show-current)"
        fi
        if [[ -z "$default_branch" ]]; then default_branch='main'; fi

        branch_exists='false'
        pr_number=''
        if [[ \
          "$FROG_INPUT_PUSH" == 'pull-request' &&
          "$FROG_INPUT_DRY_RUN" == 'false'
        ]]; then
          if [[ "$FROG_INPUT_BRANCH" == "$default_branch" ]]; then
            fail 'branch must differ from the default branch when push=pull-request.'
          fi
          if [[ -z "${GITHUB_REPOSITORY:-}" ]]; then
            fail 'GITHUB_REPOSITORY is required for push=pull-request.'
          fi
          if [[ -z "$token" ]]; then fail 'token is required for push=pull-request.'; fi

          branch_ref="refs/heads/$FROG_INPUT_BRANCH"
          if ! branch_probe="$(
            git_remote ls-remote --heads -- "$FROG_INPUT_REMOTE" "$branch_ref"
          )"; then
            fail 'Could not inspect the pull-request branch.'
          fi
          if [[ -n "$branch_probe" ]]; then branch_exists='true'; fi

          if [[ "$branch_exists" == 'true' ]]; then
            if ! pr_number="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --base "$default_branch" \
                --head "$FROG_INPUT_BRANCH" \
                --state open \
                --json number,headRepository,headRepositoryOwner |
                jq -r \
                  --arg owner "${GITHUB_REPOSITORY%%/*}" \
                  --arg repo "$GITHUB_REPOSITORY" \
                  '[
                    .[]
                    | select(
                        .headRepositoryOwner.login == $owner and
                        .headRepository.nameWithOwner == $repo
                      )
                  ][0].number // empty'
            )"; then
              fail 'Could not inspect the pull request.'
            fi
          fi
        fi

        common=(
          --cwd "$cwd"
          --expected-author "$issue_author"
          --json
          --full-output
        )
        if [[ "$FROG_INPUT_COMMIT" == 'false' ]]; then common+=(--no-commit); fi
        if [[ "$FROG_INPUT_DRY_RUN" == 'true' ]]; then common+=(--dry-run); fi

        publish_args=(publish "${common[@]}")
        if [[ -n "$FROG_INPUT_MAX" ]]; then publish_args+=(--max "$FROG_INPUT_MAX"); fi

        publish_status=0
        publish_output="$("$frog_command" "${publish_args[@]}")" || publish_status=$?
        echo '::group::frog publish'
        printf '%s\n' "$publish_output"
        echo '::endgroup::'

        sync_status=0
        sync_output="$("$frog_command" sync "${common[@]}")" || sync_status=$?
        echo '::group::frog sync'
        printf '%s\n' "$sync_output"
        echo '::endgroup::'

        if ! jq -e '.ok == true' >/dev/null 2>&1 <<< "$publish_output"; then
          publish_status=1
        fi
        if ! jq -e '.ok == true' >/dev/null 2>&1 <<< "$sync_output"; then sync_status=1; fi

        write_multiline_output publish "$publish_output"
        write_multiline_output sync "$sync_output"
        publish_deferred="$(json_count "$publish_output" deferred)"
        sync_deferred="$(json_count "$sync_output" deferred)"
        {
          echo "created=$(json_count "$publish_output" created)"
          echo "commented=$(json_count "$publish_output" commented)"
          echo "publish-deferred=$publish_deferred"
          echo "cleared=$(json_count "$sync_output" cleared)"
          echo "removed=$(json_count "$sync_output" removed)"
          echo "reopened=$(json_count "$sync_output" reopened)"
          echo "updated=$(json_count "$sync_output" updated)"
          echo "sync-deferred=$sync_deferred"
        } >> "$GITHUB_OUTPUT"

        publish_committed="$(json_committed "$publish_output")"
        sync_committed="$(json_committed "$sync_output")"
        committed='false'
        if [[ "$publish_committed" == 'true' || "$sync_committed" == 'true' ]]; then
          committed='true'
        fi

        should_push='false'
        if [[ \
          "$FROG_INPUT_PUSH" == 'pull-request' &&
          "$branch_exists" == 'true' &&
          -n "$pr_number" &&
          (
            "$publish_status" != '0' ||
            "$sync_status" != '0' ||
            "$publish_deferred" != '0' ||
            "$sync_deferred" != '0'
          )
        ]]; then
          # Keep queued review changes until the run completes without failures or deferrals.
          echo '::warning::Frog did not fully complete, preserving the existing pull-request branch.'
        elif [[ "$FROG_INPUT_PUSH" != 'none' && "$committed" == 'true' ]]; then
          should_push='true'
        elif [[ \
          "$FROG_INPUT_PUSH" == 'pull-request' &&
          "$FROG_INPUT_DRY_RUN" == 'false' &&
          "$branch_exists" == 'true' &&
          -n "$pr_number" &&
          "$publish_status" == '0' &&
          "$sync_status" == '0'
        ]]; then
          # Reset an existing review branch even when a close followed by a reopen leaves no new commit.
          should_push='true'
        fi

        push_status=0
        pr_status=0
        if [[ "$should_push" == 'true' && "$FROG_INPUT_PUSH" == 'direct' ]]; then
          git_remote push -- "$FROG_INPUT_REMOTE" \
            "HEAD:refs/heads/$default_branch" || push_status=$?
        elif [[ "$should_push" == 'true' && "$FROG_INPUT_PUSH" == 'pull-request' ]]; then
          git_remote push --force -- "$FROG_INPUT_REMOTE" \
            "HEAD:refs/heads/$FROG_INPUT_BRANCH" || push_status=$?

          if [[ "$push_status" == '0' ]]; then
            publish_json="$(jq -c . <<< "$publish_output" 2>/dev/null || printf '{"data":{}}')"
            sync_json="$(jq -c . <<< "$sync_output" 2>/dev/null || printf '{"data":{}}')"
            body_file="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/frog-body.XXXXXX")"
            jq -nr \
              --argjson publish "$publish_json" \
              --argjson sync "$sync_json" \
              --arg server "${GITHUB_SERVER_URL:-https://github.com}" '
              def values($envelope; $key): ($envelope.data[$key] // []);
              def plain:
                map("-   `\(.id)` \(.title)") | join("\n\n");
              def linked($server):
                map(
                  if (.issue | test("^[^#]+#[0-9]+$")) then
                    (.issue | capture("^(?<repo>[^#]+)#(?<number>[0-9]+)$")) as $link
                    | "-   [\(.issue)](\($server)/\($link.repo)/issues/\($link.number)) \(.title)"
                  else
                    "-   `\(.id)` \(.title)"
                  end
                ) | join("\n\n");
              def section($title; $body):
                if $body == "" then null else "## \($title)\n\n\($body)" end;
              [
                "Opened by the [Frog](https://github.com/wevm/frog) action.",
                section("Resolved"; values($sync; "removed") | plain),
                section("Reopened"; values($sync; "reopened") | plain),
                section(
                  "Linked";
                  (values($publish; "created") + values($publish; "commented")) | linked($server)
                )
              ]
              | map(select(. != null))
              | join("\n\n")
            ' > "$body_file" || pr_status=$?

            if [[ "$pr_status" == '0' ]]; then
              if [[ -n "$pr_number" ]]; then
                gh pr edit "$pr_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title 'chore: sync friction log' \
                  --body-file "$body_file" || pr_status=$?
              else
                gh pr create \
                  --repo "$GITHUB_REPOSITORY" \
                  --base "$default_branch" \
                  --head "$FROG_INPUT_BRANCH" \
                  --title 'chore: sync friction log' \
                  --body-file "$body_file" || pr_status=$?
              fi
            fi
          fi
        fi

        final_status=0
        for status in "$publish_status" "$sync_status" "$push_status" "$pr_status"; do
          if [[ "$status" != '0' ]]; then final_status=1; fi
        done
        if [[ "$final_status" != '0' ]]; then
          fail 'Frog did not complete successfully. See the publish, sync, and push logs above.'
        fi
