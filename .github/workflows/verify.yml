name: Verify
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # Not `pnpm check`, which passes `--fix` and would rewrite the checkout instead of failing.
      - name: Check code
        run: pnpm exec vp check

      - name: Check types
        run: pnpm check:types

      - name: Check app types
        run: pnpm --dir app check:types

      - name: Check docs
        run: pnpm check:docs

      - name: Build
        run: pnpm build

      # The Worker has to bundle, which the unit tests cannot tell us.
      - name: Bundle the app
        run: pnpm --dir app exec wrangler deploy --dry-run

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # The git layer's tests commit in throwaway repositories, which needs an identity.
      - name: Configure git
        run: |
          git config --global user.name 'frog'
          git config --global user.email 'frog@users.noreply.github.com'

      - name: Run tests
        run: pnpm test --run
        env:
          CI: true
