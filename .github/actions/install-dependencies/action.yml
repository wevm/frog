name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        cache: pnpm
        node-version: 22

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
