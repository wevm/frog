name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@b518cf981b50a4c745a8b7335fc693f34b108a75

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        cache: pnpm
        node-version: 22

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
